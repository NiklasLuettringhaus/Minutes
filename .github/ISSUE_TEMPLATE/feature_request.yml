name: Feature request
description: Something Minutes should do and does not
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What goes wrong today, in terms of a real meeting you had.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
      description: Optional. The problem is the valuable half.
